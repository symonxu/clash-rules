# XM Clash 规则配置 · 极速云版（App：Clash - 基于规则的网络代理工具，iPhone / iPad / Mac 通用；说明见 README.md）
# 本文件只有分组、规则和 DNS，没有节点、没有订阅地址，也不需要手动编辑：用 App 的「配置链接」导入，自动跟随仓库更新。
# 节点来自在 App 里另外导入的极速云订阅（节点来源）；各组用 include-all + 节点名正则从中筛选，url-test / fallback 自动测速。
# 任何分组都不得包含香港节点：每组都用 exclude-filter 排除（CI 校验）。
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
# GEOIP 数据库用 jsDelivr 国内可达镜像（默认 GitHub 地址在大陆常下载失败）。
geox-url:
  geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
  geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
  mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'captive.apple.com'
    - 'time.apple.com'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - '+.cdn-apple.com'
    - 'swcdn.apple.com'
    - 'swdist.apple.com'
    - 'swscan.apple.com'
    - '+.aaplimg.com'
    - '+.ks-cdn.com'
    - '+.ksyuncdn.com'
    - '+.alikunlun.com'
    - 'ocsp2.apple.com'
    - '+.akadns.net'
    - '+.akamaiedge.net'
    - '+.openbot.run'
    - '+.openbot.site'
    - '+.ts.net'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    '+.cdn-apple.com,swcdn.apple.com,swdist.apple.com,swscan.apple.com,ocsp2.apple.com,+.aaplimg.com,+.akadns.net,+.akamaiedge.net,+.ks-cdn.com,+.ksyuncdn.com,+.alikunlun.com': ['https://223.5.5.5/dns-query', 'https://doh.pub/dns-query']
    '+.ts.net': ['100.100.100.100']
# 放行 Tailscale CGNAT 网段（含 MagicDNS 100.100.100.100）出 TUN，由官方 Tailscale 客户端直接接管。
tun:
  route-exclude-address:
    - 100.64.0.0/10
proxy-groups:
  # 与花云同一组名。极速云仍自动测速全部日本_*，不改成花云那 5 条专线。
  - name: XM-AI工具
    type: url-test
    include-all: true
    filter: '(^| )日本_[0-9]+$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 900
    tolerance: 20
    timeout: 5000
  - name: XM-Web3
    type: url-test
    include-all: true
    filter: '(^| )(马来西亚|菲律宾|越南)(_[0-9]+)?$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 900
    tolerance: 20
    timeout: 5000
  # 台湾_01 优先，其次台湾_02，再其次其余台湾节点（filter 用 ` 分隔，按顺序排列）。
  - name: XM-Bybit
    type: fallback
    include-all: true
    filter: '(^| )台湾_01$`(^| )台湾_02$`(^| )台湾_(0[3-9]|[1-9][0-9])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 900
    timeout: 5000
  - name: XM-日常上网
    type: url-test
    include-all: true
    filter: '(^| )日本_[0-9]+$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 900
    tolerance: 20
    timeout: 5000
  - name: XM-Apple
    type: url-test
    include-all: true
    filter: '(^| )美国_0[1-3]$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 900
    tolerance: 20
    timeout: 5000
  # XM-Anki：AnkiWeb 同步固定一个节点。手动 select，候选按 日本_01 → 02 → 03 排列（filter 用反引号分段按顺序拼接）。
  - name: XM-Anki
    type: select
    include-all: true
    filter: '(^| )日本_01$`(^| )日本_02$`(^| )日本_03$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰'
  - name: XM-系统更新
    type: select
    proxies:
      - DIRECT
    include-all: true
    filter: '(^| )日本_01$`(^| )日本_02$`(^| )日本_03$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰'
# 规则从上到下匹配；由 scripts/validate_clash.rb 校验（语法、目标组、重复、顺序）。
rules:
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  # 屏蔽 QUIC（UDP 443），迫使 App 回落到 TCP，让域名规则生效（无嗅探时 UDP 只能按 IP 匹配）。放在局域网直连之后、域名规则之前。
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # Tailscale 必须直连：控制面、DERP 中转走默认规则会被送进机场，握手要 1 秒以上，登录和连接设备都会卡。
  # 100.64.0.0/10 是 tailnet 网段（含 MagicDNS 的 100.100.100.100），任何时候都不能代理。
  - DOMAIN-SUFFIX,tailscale.com,DIRECT
  - DOMAIN-SUFFIX,tailscale.io,DIRECT
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
