# XM iOS 分组扩展配置；不是模块或节点订阅。
# 需先保留本地 MESL 官方 get.conf，再使用本配置。
# 个人规则由 XM-Shadowrocket-iOS.sgmodule 提供。
[General]
include = get.conf
update-url = https://raw.githubusercontent.com/symonxu/clash-rules/main/XM-Shadowrocket-Groups.conf

[Proxy Group]
XM-Google = select,policy-regex-filter=日本 08 家宽
XM-AI = select,policy-regex-filter=日本 (08|09|10) 家宽
XM-Meta = select,policy-regex-filter=(美国|United States|USA)
XM-Bybit = select,policy-regex-filter=(澳大利亚|澳洲|Australia|格鲁吉亚|Georgia)
XM-Web3 = select,policy-regex-filter=(日本 (08|09|10) 家宽|日本 0[1-3])

