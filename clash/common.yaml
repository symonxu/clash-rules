proxy-providers:
  MESL-Nodes:
    type: http
    url: https://example.invalid/MESL_PRIVATE_URL
    path: ./providers/mesl-nodes.yaml
    interval: 21600
    header:
      User-Agent:
      - Stash/3.2.0
    health-check:
      enable: false
      url: ''
      interval: 0
      lazy: false
proxy-groups:
- name: 🌐 日常上网
  type: select
  interval: 0
  proxies:
  - ⚡ 自动选快
  - 🧭 全部节点
  empty-fallback: REJECT
- name: ⚡ 自动选快
  type: url-test
  use:
  - MESL-Nodes
  filter: ^(🇸🇬 新加坡 0[1-3]|🇯🇵 日本 0[1-3])
  interval: 300
  lazy: true
  empty-fallback: REJECT
  url: http://www.apple.com
- name: 🧭 全部节点
  type: select
  use:
  - MESL-Nodes
  interval: 0
  empty-fallback: REJECT
- name: 🔎 Google服务
  type: fallback
  use:
  - MESL-Nodes
  filter: ^🇯🇵 日本 0[1-3]
  interval: 300
  lazy: false
  empty-fallback: REJECT
  url: http://www.apple.com
- name: 🤖 AI工具
  type: fallback
  use:
  - MESL-Nodes
  filter: ^🇯🇵 日本 (08|09|10) 家宽
  interval: 300
  lazy: false
  empty-fallback: REJECT
  url: http://www.apple.com
- name: 🇯🇵 Web3-日本家宽
  type: fallback
  use:
  - MESL-Nodes
  filter: ^🇯🇵 日本 (08|09|10) 家宽
  interval: 300
  lazy: false
  empty-fallback: REJECT
  url: http://www.apple.com
- name: 🇯🇵 Web3-日本普通
  type: url-test
  use:
  - MESL-Nodes
  filter: ^🇯🇵 日本 0[1-3]
  interval: 300
  lazy: false
  empty-fallback: REJECT
  url: http://www.apple.com
- name: 💰 Web3交易
  type: fallback
  proxies:
  - 🇯🇵 Web3-日本家宽
  - 🇯🇵 Web3-日本普通
  interval: 300
  lazy: false
  empty-fallback: REJECT
  url: http://www.apple.com
- name: ⛓️ Web3链上数据
  type: url-test
  use:
  - MESL-Nodes
  filter: ^(🇯🇵 日本 (08|09|10) 家宽|🇯🇵 日本 0[1-3])
  interval: 300
  lazy: false
  empty-fallback: REJECT
  url: http://www.apple.com
