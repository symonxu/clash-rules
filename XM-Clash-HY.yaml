# XM Clash 规则配置 · 花云版（App：Clash - 基于规则的网络代理工具，iPhone / iPad / Mac 通用；说明见 README.md）
# 本文件有分组、规则、DNS 和花云节点入口的 hosts，没有节点、没有订阅地址，也不需要手动编辑：用 App 的「配置链接」导入，自动跟随仓库更新。
# 节点来自在 App 里另外导入的花云订阅（节点来源）。XM-AI工具 手动选择下面 5 条日本线路。其余组用 include-all + 节点名正则筛选，url-test 自动选延迟最低。
# 规则部分必须与 XM-Clash-JSY.yaml 完全一致（CI 校验）。
# hosts 把花云订阅里的 3 个节点域名改写到国内入口。Clash 组合规则方案时不会带上订阅里的 hosts，所以写在这里。订阅换了这 3 个域名就要一起改。
# 任何分组都不得包含香港节点：每组都用 exclude-filter 排除（CI 校验）。
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
# TCP 保活，作用于全部连接：闲置 30 秒后开始探测，之后每 15 秒一次。
keep-alive-idle: 30
keep-alive-interval: 15
disable-keep-alive: false
# GEOIP 数据库用 jsDelivr 国内可达镜像（默认 GitHub 地址在大陆常下载失败）。
geox-url:
  geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
  geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
  mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'captive.apple.com'
    - 'time.apple.com'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - '+.cdn-apple.com'
    - 'swcdn.apple.com'
    - 'swdist.apple.com'
    - 'swscan.apple.com'
    - '+.aaplimg.com'
    - '+.ks-cdn.com'
    - '+.ksyuncdn.com'
    - '+.alikunlun.com'
    - 'ocsp2.apple.com'
    - '+.akadns.net'
    - '+.akamaiedge.net'
    - '+.openbot.run'
    - '+.openbot.site'
    - '+.apt-agent.org'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - tls://223.5.5.5
    - https://dns.alidns.com/dns-query
  # 节点域名不走上面的 DoT。119.29.29.29 的 853 在家庭宽带上会挂满健康检查的 5 秒。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    '+.cdn-apple.com,swcdn.apple.com,swdist.apple.com,swscan.apple.com,ocsp2.apple.com,+.aaplimg.com,+.akadns.net,+.akamaiedge.net,+.ks-cdn.com,+.ksyuncdn.com,+.alikunlun.com': ['https://223.5.5.5/dns-query', 'https://doh.pub/dns-query']
# 花云节点域名 *.aws-agent.org 走加密 DNS 会解析到 147.90.*，家里到这些地址要 400ms 以上。
# 2026-11-11 订阅实际用的是下面两个域名，2026-11-12 订阅又多了 0bc52bj8-10e0（欧洲节点在用，公网已经解析到国内 58.247.187.127）。
# 写成国内入口后，到入口大约 60ms。北京 116.242.224.8 已拒绝连接，不要再写。订阅换域名要一起改。
hosts:
  e3585sh2-3ad5.aws-agent.org: 180.188.20.131
  fd025gz0-c617.aws-agent.org: 119.147.195.213
  0bc52bj8-10e0.aws-agent.org: 58.247.187.127
proxy-groups:
  # Google、AI、OpenBot 合成一组，手动从 5 条日本线路里选。顺序按 2026-11-12 08:47 测速，最快的在前。
  - name: XM-AI工具
    type: select
    proxies:
      - 🇯🇵 日本高级 IEPL 专线 2
      - 🇯🇵 日本标准 IEPL 专线 1
      - 🇯🇵 日本标准 IEPL 专线 3
      - 🇯🇵 日本高级 IEPL 专线 3
      - 🇯🇵 日本标准 IEPL 专线 2
  - name: XM-Web3
    type: url-test
    include-all: true
    filter: '(^| )(韩国标准 IEPL 专线 [1-2]|越南标准 IEPL 专线 1|印尼标准 IEPL 专线 1)$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-Bybit
    type: url-test
    include-all: true
    filter: '(^| )台湾(高级 IEPL 专线 [1-3]|标准 IEPL 专线 [1-3])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-日常上网
    type: url-test
    include-all: true
    filter: '(^| )日本(高级 IEPL 专线 [1-3]|标准 IEPL 专线 [1-4])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-Apple
    type: url-test
    include-all: true
    filter: '(^| )美国(高级 IEPL 专线 [1-3]|标准 IEPL 专线 [1-4])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  # XM-Anki：AnkiWeb 同步固定一个节点，避免 url-test 同步中途切换。手动 select，候选按 日本高级 1 → 2 → 3 排列（filter 用反引号分段按顺序拼接）。
  - name: XM-Anki
    type: select
    include-all: true
    filter: '(^| )日本高级 IEPL 专线 1$`(^| )日本高级 IEPL 专线 2$`(^| )日本高级 IEPL 专线 3$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
  - name: XM-系统更新
    type: select
    proxies:
      - DIRECT
    include-all: true
    filter: '(^| )日本高级 IEPL 专线 1$`(^| )日本高级 IEPL 专线 2$`(^| )日本高级 IEPL 专线 3$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
# 规则从上到下匹配；由 scripts/validate_clash.rb 校验（语法、目标组、重复、顺序）。
rules:
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  # 屏蔽 QUIC（UDP 443），迫使 App 回落到 TCP，让域名规则生效（无嗅探时 UDP 只能按 IP 匹配）。放在局域网直连之后、域名规则之前。
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # Tailscale 必须直连：控制面、DERP 中转走默认规则会被送进机场，握手要 1 秒以上，登录和连接设备都会卡。
  # 100.64.0.0/10 是 tailnet 网段（含 MagicDNS 的 100.100.100.100），任何时候都不能代理。
  - DOMAIN-SUFFIX,tailscale.com,DIRECT
  - DOMAIN-SUFFIX,tailscale.io,DIRECT
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
