# XM Clash 规则配置 · 花云版（App：Clash - 基于规则的网络代理工具，iPhone / iPad / Mac 通用；说明见 README.md）
# 本文件只有分组、规则和 DNS，没有节点、没有订阅地址，也不需要手动编辑：用 App 的「配置链接」导入，自动跟随仓库更新。
# 节点来自在 App 里另外导入的花云订阅（节点来源）；各组用 include-all + 节点名正则从中筛选，url-test 自动选延迟最低。
# 规则部分必须与 XM-Clash-JSY.yaml 完全一致（CI 校验）。
# 任何分组都不得包含香港节点：每组都用 exclude-filter 排除（CI 校验）。
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'captive.apple.com'
    - 'time.apple.com'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
proxy-groups:
  # 花云：每组 6–7 个节点（同地区高级 1–3 + 标准），全部 url-test 自动选延迟最低；不用实验性和香港节点。
  - name: XM-Google
    type: url-test
    include-all: true
    filter: '(^| )日本(高级 IEPL 专线 [1-3]|标准 IEPL 专线 [1-4])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-AI
    type: url-test
    include-all: true
    filter: '(^| )日本(高级 IEPL 专线 [1-3]|标准 IEPL 专线 [1-4])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-Web3
    type: url-test
    include-all: true
    filter: '(^| )(韩国标准 IEPL 专线 [1-2]|越南标准 IEPL 专线 1|印尼标准 IEPL 专线 1)$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-Bybit
    type: url-test
    include-all: true
    filter: '(^| )台湾(高级 IEPL 专线 [1-3]|标准 IEPL 专线 [1-3])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-日常上网
    type: url-test
    include-all: true
    filter: '(^| )日本(高级 IEPL 专线 [1-3]|标准 IEPL 专线 [1-4])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-Apple
    type: url-test
    include-all: true
    filter: '(^| )美国(高级 IEPL 专线 [1-3]|标准 IEPL 专线 [1-4])$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  # XM-Anki：AnkiWeb 同步固定一个节点，避免 url-test 同步中途切换。fallback 固定顺序：日本高级 1 → 2 → 3（filter 用反引号分段，mihomo 按段顺序拼接）。
  - name: XM-Anki
    type: select
    include-all: true
    filter: '(^| )日本高级 IEPL 专线 1$`(^| )日本高级 IEPL 专线 2$`(^| )日本高级 IEPL 专线 3$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
  - name: XM-系统更新
    type: select
    proxies:
      - DIRECT
    include-all: true
    filter: '(^| )日本高级 IEPL 专线 1$`(^| )日本高级 IEPL 专线 2$`(^| )日本高级 IEPL 专线 3$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|traffic|expire|香港|HK|Hong ?Kong|🇭🇰'
# 规则从上到下匹配；由 scripts/validate_clash.rb 校验（语法、目标组、重复、顺序）。
rules:
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  # 屏蔽 QUIC（UDP 443），迫使 App 回落到 TCP，让域名规则生效（无嗅探时 UDP 只能按 IP 匹配）。放在局域网直连之后、域名规则之前。
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
