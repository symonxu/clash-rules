# Clash Verge MESL 个人策略；只替换分组与规则，DNS 和节点继承本机订阅。
# 五组由新版本地同步程序自动择优：每 300 秒测速，快超过 20ms 才切换。
# select 保留为控制接口；无需在客户端手动选节点。单独导入本 YAML 不会开启自动择优。
proxy-groups:
  - name: XM-Google
    type: select
    include-all: true
    exclude-type: direct
    filter: '(^| )日本 (0[2-4]|(08|09|10) 家宽)$'
  - name: XM-AI
    type: select
    include-all: true
    exclude-type: direct
    filter: '(^| )日本 (0[2-4]|(08|09|10) 家宽)$'
  - name: XM-Meta
    type: select
    include-all: true
    exclude-type: direct
    filter: '(^| )美国 (0[1-3]|1[0-2] 家宽)$'
  - name: XM-Web3
    type: select
    include-all: true
    exclude-type: direct
    filter: '(^| )日本 (0[2-4]|(08|09|10) 家宽)$'
  - name: XM-日常上网
    type: select
    include-all: true
    exclude-type: direct
    filter: '(^| )日本 (0[2-4]|(08|09|10) 家宽)$'
rule-providers: {}
rules:
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
