# XM-个人配置V1.3 — Hako 规则方案（测试版）
# 从 V1.1 稳定配置派生；本版尚待 Hako 实测。
# 仅为 generate_204 测速增加 HTTP 204 校验；DNS、分流地区与测速频率沿用 V1.1。
# Hako 节点库独立管理 MESL；本文件不包含 MESL 订阅地址或 Proxy Provider。
# GitHub 负责策略组、DNS 与模块化远程规则；节点由 Hako 创建配置时注入。

