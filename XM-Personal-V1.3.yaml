profile:
  store-selected: true
  store-fake-ip: true

proxy-groups:
  # 与 Shadowrocket 对齐：五个手动组，每组普通/家宽各三个节点。
  - name: 🌐 日常上网
    type: select
    include-all: true
    exclude-type: direct
    filter: '日本 (0[2-4](\s|$)|(08|09|10) 家宽(\s|$))'

  - name: 🔎 Google服务
    type: select
    include-all: true
    exclude-type: direct
    filter: '日本 (0[2-4](\s|$)|(08|09|10) 家宽(\s|$))'

  - name: 🤖 AI工具
    type: select
    include-all: true
    exclude-type: direct
    filter: '日本 (0[2-4](\s|$)|(08|09|10) 家宽(\s|$))'

  - name: 🟦 Meta服务
    type: select
    include-all: true
    exclude-type: direct
    filter: '美国 (0[1-3](\s|$)|1[0-2] 家宽(\s|$))'

  - name: 💰 Web3交易
    type: select
    include-all: true
    exclude-type: direct
    filter: '日本 (0[2-4](\s|$)|(08|09|10) 家宽(\s|$))'

rule-providers:
  Web3链上:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/web3-rpc.yaml
    path: ./rule-providers/xm-web3-rpc.yaml
    interval: 3600
  Web3交易规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/web3.yaml
    path: ./rule-providers/xm-web3.yaml
    interval: 3600
  AI规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/ai.yaml
    path: ./rule-providers/xm-ai.yaml
    interval: 3600
  Google规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/google.yaml
    path: ./rule-providers/xm-google.yaml
    interval: 3600
  Meta规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/meta.yaml
    path: ./rule-providers/xm-meta.yaml
    interval: 3600
  Bybit规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/bybit.yaml
    path: ./rule-providers/xm-bybit.yaml
    interval: 3600
  中国大陆域名:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./rule-providers/china-direct-domain.yaml
    interval: 86400
rules:
  # 局域网
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # 顺序很重要：链上 RPC → Bybit → Web3 → AI → Google → Meta → 中国
  - RULE-SET,Web3链上,💰 Web3交易
  - RULE-SET,Bybit规则,💰 Web3交易
  - RULE-SET,Web3交易规则,💰 Web3交易
  - RULE-SET,AI规则,🤖 AI工具
  - RULE-SET,Google规则,🔎 Google服务
  - RULE-SET,Meta规则,🟦 Meta服务

  # 中国大陆
  - RULE-SET,中国大陆域名,DIRECT
  - GEOIP,CN,DIRECT

  # 其他海外
  - MATCH,🌐 日常上网
