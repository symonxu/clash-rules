profile:
  store-selected: true
  store-fake-ip: true

proxy-groups:
  - name: 🌐 日常上网
    type: select
    proxies:
      - ⚡ 自动选快
      - 🧭 全部节点

  - name: ⚡ 自动选快
    type: url-test
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    include-all: true
    exclude-type: direct
    filter: '^(🇸🇬 新加坡 0[1-3]|🇯🇵 日本 0[1-3])'
    interval: 600
    lazy: true

  - name: 🧭 全部节点
    type: select
    include-all: true
    exclude-type: direct
    # 只关闭该组的定时测速；同一节点仍可被其他常用组测速。

  - name: 🔎 Google服务
    type: fallback
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    include-all: true
    exclude-type: direct
    filter: '^🇯🇵 日本 08 家宽'
    interval: 300
    lazy: false

  - name: 🟦 Meta服务
    # Muse 当前仅在美国推出；Meta 旗下服务统一保持美国出口，账户与会话更一致。
    type: fallback
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    include-all: true
    exclude-type: direct
    filter: '^🇺🇸 美国'
    interval: 300
    lazy: false

  - name: 🤖 AI工具
    type: fallback
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    include-all: true
    exclude-type: direct
    filter: '^🇯🇵 日本 (08|09|10) 家宽'
    interval: 300
    lazy: false

  - name: 💹 Bybit网络
    # 手动选择澳大利亚或格鲁吉亚节点；仅纳入节点名含对应国家名或国旗的代理。
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)(🇦🇺|澳大利亚|澳洲|Australia|🇬🇪|格鲁吉亚|Georgia)'

  - name: 🇯🇵 Web3-日本家宽
    # 按订阅顺序选择可用节点；故障或恢复时仍可能切换，不保证固定 IP。
    type: fallback
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    include-all: true
    exclude-type: direct
    filter: '^🇯🇵 日本 (08|09|10) 家宽'
    interval: 300
    lazy: false

  - name: 🇯🇵 Web3-日本普通
    type: url-test
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    include-all: true
    exclude-type: direct
    filter: '^🇯🇵 日本 0[1-3]'
    interval: 300
    lazy: false

  - name: 💰 Web3交易
    type: fallback
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    proxies:
      - 🇯🇵 Web3-日本家宽
      - 🇯🇵 Web3-日本普通
    interval: 300
    lazy: false

  - name: ⛓️ Web3链上数据
    type: url-test
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    include-all: true
    exclude-type: direct
    filter: '^(🇯🇵 日本 (08|09|10) 家宽|🇯🇵 日本 0[1-3])'
    interval: 300
    lazy: false

rule-providers:
  Web3链上:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/web3-rpc.yaml
    path: ./rule-providers/xm-web3-rpc.yaml
    interval: 3600
  Web3交易规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/web3.yaml
    path: ./rule-providers/xm-web3.yaml
    interval: 3600
  AI规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/ai.yaml
    path: ./rule-providers/xm-ai.yaml
    interval: 3600
  Google规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/google.yaml
    path: ./rule-providers/xm-google.yaml
    interval: 3600
  Meta规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/meta.yaml
    path: ./rule-providers/xm-meta.yaml
    interval: 3600
  Apple代理规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/apple-proxy.yaml
    path: ./rule-providers/xm-apple-proxy.yaml
    interval: 3600
  Apple直连规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/apple-direct.yaml
    path: ./rule-providers/xm-apple-direct.yaml
    interval: 3600
  Bybit规则:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/symonxu/clash-rules/main/rules/bybit.yaml
    path: ./rule-providers/xm-bybit.yaml
    interval: 3600
  中国大陆域名:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./rule-providers/china-direct-domain.yaml
    interval: 86400
  中国大陆IP:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    path: ./rule-providers/china-direct-ip.yaml
    interval: 86400

rules:
  # 局域网
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # 顺序很重要：链上 RPC → Bybit → Web3 → AI → Google → Meta → Apple/中国
  - RULE-SET,Web3链上,⛓️ Web3链上数据
  - RULE-SET,Bybit规则,💹 Bybit网络
  - RULE-SET,Web3交易规则,💰 Web3交易
  - RULE-SET,AI规则,🤖 AI工具
  - RULE-SET,Google规则,🔎 Google服务
  - RULE-SET,Meta规则,🟦 Meta服务

  # Apple Push 保持日常代理；其余 Apple 规则直连
  - DOMAIN-SUFFIX,push.apple.com,🌐 日常上网
  - DOMAIN-SUFFIX,push-apple.com.akadns.net,🌐 日常上网
  - DOMAIN-SUFFIX,courier-push-apple.com.akadns.net,🌐 日常上网
  - RULE-SET,Apple代理规则,🌐 日常上网
  - RULE-SET,Apple直连规则,DIRECT

  # 中国大陆
  - RULE-SET,中国大陆域名,DIRECT
  - RULE-SET,中国大陆IP,DIRECT
  - GEOIP,CN,DIRECT

  # 其他海外
  - MATCH,🌐 日常上网
