# XM Clash 规则配置 · 极速云 + 花云（App：Clash - 基于规则的网络代理工具，iPhone / iPad / Mac 通用；说明见 README.md）
# 本文件只有分组、规则和 DNS，没有节点，也没有订阅地址。节点和规则集的地址都不写在这个文件里。
# 用 App 的「添加配置链接」导入。导入后在这份配置里「添加代理来源」，分别选已经导入的极速云和 Flower_SS。订阅由 App 自己保存和更新。
# 分组里写的是这两家节点的显示名。来源里的名字如果改了，对应项会解析不到，需要改这里。
# 两个来源都加上之前，不要点「使用此配置」。不点「使用此配置」就不会替换当前正在用的配置。
# 任何分组都不含香港节点。
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
# GEOIP 数据库用 jsDelivr 国内可达镜像（默认 GitHub 地址在大陆常下载失败）。
geox-url:
  geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
  geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
  mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'captive.apple.com'
    - 'time.apple.com'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - '+.cdn-apple.com'
    - 'swcdn.apple.com'
    - 'swdist.apple.com'
    - 'swscan.apple.com'
    - '+.aaplimg.com'
    - '+.ks-cdn.com'
    - '+.ksyuncdn.com'
    - '+.alikunlun.com'
    - 'ocsp2.apple.com'
    - '+.akadns.net'
    - '+.akamaiedge.net'
    - '+.openbot.run'
    - '+.openbot.site'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    '+.cdn-apple.com,swcdn.apple.com,swdist.apple.com,swscan.apple.com,ocsp2.apple.com,+.aaplimg.com,+.akadns.net,+.akamaiedge.net,+.ks-cdn.com,+.ksyuncdn.com,+.alikunlun.com': ['https://223.5.5.5/dns-query', 'https://doh.pub/dns-query']
