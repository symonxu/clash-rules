# XM Clash 多订阅方案（模板）。仓库里没有订阅地址。
# 本机可导入的副本是 local/XM-Clash-MULTI.yaml（不入库）：只把下面两个 PASTE_ 占位符换成极速云、花云的订阅地址。
# 导入时作为一份独立配置，不要把它当成「规则方案」挂到某一个订阅上，否则 App 只会留下那一家节点。
# iPhone 不能用 type: file 的外部节点集（Clash 1.0.14 会拒绝）。这里用 type: http。
# 规则按策略切成 19 个 classical 规则集。mihomo 1.19.32 的一条 RULE-SET 只使用这一条上的策略；AND 的策略不能留在规则集行内；GEOIP 放进规则集会被丢掉，所以 GEOIP 和 MATCH 留在下面的 rules 里。
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
geox-url:
  geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
  geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
  mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'captive.apple.com'
    - 'time.apple.com'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - '+.cdn-apple.com'
    - 'swcdn.apple.com'
    - 'swdist.apple.com'
    - 'swscan.apple.com'
    - '+.aaplimg.com'
    - '+.ks-cdn.com'
    - '+.ksyuncdn.com'
    - '+.alikunlun.com'
    - 'ocsp2.apple.com'
    - '+.akadns.net'
    - '+.akamaiedge.net'
    - '+.openbot.run'
    - '+.openbot.site'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    '+.cdn-apple.com,swcdn.apple.com,swdist.apple.com,swscan.apple.com,ocsp2.apple.com,+.aaplimg.com,+.akadns.net,+.akamaiedge.net,+.ks-cdn.com,+.ksyuncdn.com,+.alikunlun.com': ['https://223.5.5.5/dns-query', 'https://doh.pub/dns-query']
proxy-providers:
  jsy:
    type: http
    url: "PASTE_JSY_SUBSCRIPTION_URL"
    path: ./providers/jsy.yaml
    interval: 86400
    header:
      User-Agent: ["Clash"]
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
  hy:
    type: http
    url: "PASTE_HY_SUBSCRIPTION_URL"
    path: ./providers/hy.yaml
    interval: 86400
    header:
      User-Agent: ["Clash"]
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
