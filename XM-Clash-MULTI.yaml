proxy-groups:
  - name: HY-日本
    type: url-test
    use: [hy]
    filter: '(^| )日本高级 IEPL 专线 [1-3]$`(^| )日本标准 IEPL 专线 [1-4]$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰|Traffic|Expire'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: JSY-日本
    type: url-test
    use: [jsy]
    filter: '(^| )日本_[0-9]+$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰|Traffic|Expire'
    url: https://www.gstatic.com/generate_204
    interval: 900
    tolerance: 20
    timeout: 5000
  - name: XM-Google
    type: fallback
    proxies: [HY-日本, JSY-日本]
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
  - name: XM-AI
    type: fallback
    proxies: [HY-日本, JSY-日本]
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
  - name: XM-OpenBot
    type: fallback
    use: [jsy]
    filter: '(^| )日本_01$`(^| )日本_07$`(^| )日本_05$`(^| )日本_08$`(^| )日本_06$`(^| )日本_04$`(^| )日本_02$`(^| )日本_03$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰|Traffic|Expire'
    url: https://www.gstatic.com/generate_204
    interval: 900
    timeout: 5000
  - name: HY-Web3
    type: url-test
    use: [hy]
    filter: '(^| )韩国标准 IEPL 专线 [12]$`(^| )越南标准 IEPL 专线 1$`(^| )印尼标准 IEPL 专线 1$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰|Traffic|Expire|美国|新加坡|台湾|日本'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: HY-Web3-备用
    type: url-test
    use: [hy]
    filter: '(^| )马来西亚标准 IEPL 专线 [0-9]+$`(^| )菲律宾标准 IEPL 专线 [0-9]+$`(^| )泰国标准 IEPL 专线 [0-9]+$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰|Traffic|Expire|美国|新加坡|台湾|日本'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 10
    timeout: 5000
  - name: XM-Web3
    type: fallback
