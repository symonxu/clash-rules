    filter: '(^| )日本_01$`(^| )日本_02$`(^| )日本_03$'
    exclude-filter: '(?i)剩余|流量|套餐|到期|过期|官网|重置|订阅|香港|HK|Hong ?Kong|🇭🇰|Traffic|Expire'
